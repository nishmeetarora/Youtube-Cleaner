<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube mock (dev)</title>
    <!-- Dev-only: a rough YouTube Home (menu and grid) that runs the real hook, content script, panel and CSS with the
         fake chrome.* API in dev/chrome-shim.js. ?dark for dark mode, ?nokey to see the panel without a key, ?slow for a slow second look. -->
    <link rel="stylesheet" href="/src/content/content.css" />
    <style>
      :root { --bg: #fff; --fg: #0f0f0f; --muted: #606060; --hover: rgba(0, 0, 0, 0.05); --line: rgba(0, 0, 0, 0.1); }
      html[dark] { --bg: #0f0f0f; --fg: #f1f1f1; --muted: #aaa; --hover: rgba(255, 255, 255, 0.1); --line: rgba(255, 255, 255, 0.2); }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/20px Roboto, Arial, sans-serif; }
      ytd-app { display: flex; }
      #guide-inner-content { width: 240px; flex: none; height: 100vh; overflow-y: auto; position: sticky; top: 0; }
      ytd-guide-renderer, ytd-guide-section-renderer, ytd-browse, ytd-rich-item-renderer { display: block; }
      ytd-guide-section-renderer { padding: 12px 0; border-bottom: 1px solid var(--line); margin: 0 12px; }
      ytd-guide-section-renderer h3 { margin: 6px 12px; font-size: 16px; font-weight: 600; }
      .entry { display: flex; align-items: center; gap: 24px; height: 40px; padding: 0 12px; border-radius: 10px; font-weight: 500; }
      .entry.on { background: var(--hover); }
      .entry i { width: 24px; height: 24px; border-radius: 50%; background: var(--hover); }
      ytd-browse { flex: 1; padding: 24px; }
      #contents { display: flex; flex-wrap: wrap; }
      ytd-rich-item-renderer { width: calc(33.333% - 16px); margin: 0 8px 32px; }
      .thumb { display: block; position: relative; aspect-ratio: 16 / 9; border-radius: 12px; background: linear-gradient(135deg, hsl(var(--h) 60% 55%), hsl(calc(var(--h) + 50) 60% 35%)); }
      .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0, 0, 0, 0.75); color: #fff; font-size: 12px; font-weight: 500; padding: 1px 4px; border-radius: 4px; }
      .details { display: flex; gap: 12px; margin-top: 12px; }
      .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--hover); flex: none; }
      h3 { margin: 0 0 4px; font-size: 16px; line-height: 22px; font-weight: 500; }
      h3 a, .metadata-row a { color: inherit; text-decoration: none; }
      .metadata-row { color: var(--muted); }
      #more { margin: 0 8px; padding: 8px 16px; border-radius: 18px; border: 0; background: var(--hover); color: var(--fg); font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <ytd-app>
      <div id="guide-inner-content">
        <ytd-guide-renderer>
          <div id="sections">
            <ytd-guide-section-renderer><div class="entry on"><i></i>Home</div></ytd-guide-section-renderer>
            <ytd-guide-section-renderer>
              <h3>Subscriptions ›</h3>
              <div class="entry"><i></i>History Desk (demo)</div>
              <div class="entry"><i></i>Space Talk (demo)</div>
              <div class="entry"><i></i>Synth Band (demo)</div>
            </ytd-guide-section-renderer>
            <ytd-guide-section-renderer>
              <h3>You ›</h3>
              <div class="entry"><i></i>History</div>
              <div class="entry"><i></i>Watch later</div>
            </ytd-guide-section-renderer>
          </div>
        </ytd-guide-renderer>
      </div>
      <ytd-browse page-subtype="home">
        <div id="contents"></div>
        <button id="more" type="button">Load more (a continuation page)</button>
      </ytd-browse>
    </ytd-app>
    <script>
      if (new URLSearchParams(location.search).has('dark')) document.documentElement.setAttribute('dark', '');
      // The content script only judges on YouTube's own paths.
      history.replaceState(null, '', '/' + location.search);
    </script>
    <script src="/dev/chrome-shim.js"></script>
    <script src="/src/page/hook.js"></script>
    <script src="/src/shared/core.js"></script>
    <script src="/src/content/panel.js"></script>
    <script src="/src/content/main.js"></script>
    <script src="/dev/mock-youtube.js"></script>
  </body>
</html>
